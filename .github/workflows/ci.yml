name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit high and critical dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified scanner release
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          curl --fail --location --silent --show-error \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Prove scanner efficacy across rule categories
        run: |
          set -u
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "${fixture_dir}"' EXIT

          printf 'access_key = "%s%s"\n' "AKIA" "$(openssl rand -base64 24 | tr -dc 'A-Z2-7' | cut -c1-16)" > "${fixture_dir}/aws.txt"
          printf 'token = "%s_%s"\n' "ghp" "$(openssl rand -hex 18)" > "${fixture_dir}/github.txt"
          printf 'token = "%s-%s-%s-%s"\n' "xoxb" "123456789012" "123456789012" "$(openssl rand -hex 12)" > "${fixture_dir}/slack.txt"

          assert_detection() {
            fixture="$1"
            category="$2"

            set +e
            /tmp/gitleaks dir --no-banner --redact "${fixture}"
            scan_status="$?"
            set -e

            if [ "${scan_status}" -ne 1 ]; then
              echo "Scanner did not reject the ${category} canary."
              exit 1
            fi

            echo "Scanner rejected the ${category} canary as required."
          }

          assert_detection "${fixture_dir}/aws.txt" "structured-access-key"
          assert_detection "${fixture_dir}/github.txt" "provider-token"
          assert_detection "${fixture_dir}/slack.txt" "messaging-token"

      - name: Scan repository history
        run: /tmp/gitleaks git --log-opts=HEAD --redact --no-banner .
