name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit high and critical dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified scanner release
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --silent --show-error \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Prove scanner efficacy across rule categories
        run: |
          set -u
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "${fixture_dir}"' EXIT

          printf 'access_key = "AKIA%s"\n' "$(openssl rand -hex 8 | tr '[:lower:]' '[:upper:]')" > "${fixture_dir}/aws.txt"
          printf 'token = "ghp_%s"\n' "$(openssl rand -hex 18)" > "${fixture_dir}/github.txt"
          printf 'token = "xoxb-123456789012-123456789012-%s"\n' "$(openssl rand -hex 12)" > "${fixture_dir}/slack.txt"

          assert_rule() {
            fixture="$1"
            expected_rule="$2"
            set +e
            /tmp/gitleaks dir --no-banner --redact "${fixture}"
            scan_status="$?"
            set -e

            if [ "${scan_status}" -ne 1 ]; then
              echo "Scanner did not reject the ${expected_rule} canary."
              exit 1
            fi

            echo "Scanner rejected the ${expected_rule} canary as required."
          }

          assert_rule "${fixture_dir}/aws.txt" "aws-access-token"
          assert_rule "${fixture_dir}/github.txt" "github-pat"
          assert_rule "${fixture_dir}/slack.txt" "slack-access-token"

      - name: Scan repository history
        run: /tmp/gitleaks git --redact --no-banner .
